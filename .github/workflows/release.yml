name: Build & Release

# Every push to main is tested, built and published as its own release, so
# the newest exe is always on the Releases page. A pushed version tag
# (v1.2.0 or V1.2.0 - either case) also publishes a release under that name.
on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false # zero-dependency module: there is no go.sum to key a cache on

      # A failing test stops here, before anything is published.
      - name: Test
        run: go test ./...

      - name: Work out the version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "version=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=${{ steps.ver.outputs.version }}" \
            -o "dist/Chord Key Changer.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: Chord-Key-Changer
          path: dist/

      - name: Publish release for the tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Chord Key Changer.exe
          generate_release_notes: true

      - name: Publish release for this commit to main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chord Key Changer ${{ steps.ver.outputs.version }}
          body: |
            Automatic build of `main` at ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: dist/Chord Key Changer.exe
          generate_release_notes: true
          make_latest: true
