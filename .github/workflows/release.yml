name: Build & Release

# Every push to main is tested, built (Windows exe + Android apk) and published
# as its own release, so the newest builds are always on the Releases page.
# A pushed version tag (v1.2.0 or V1.2.0 - either case) also publishes a
# release under that name. Pushes to claude/** branches build without releasing.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Work out the version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "version=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false # zero-dependency module: there is no go.sum to key a cache on

      # A failing test stops here, before anything is published.
      - name: Test
        run: go test ./...

      - name: Build Windows exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=${{ needs.version.outputs.version }}" \
            -o "dist/Chord Key Changer.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Go engine for Android (chordkey.aar)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          gomobile init
          android/build-aar.sh "${{ needs.version.outputs.version }}"

      # The same signing key every build, so a new apk installs over the old
      # one. Without the secrets the apk is signed with a throwaway debug key.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set - apk signed with a debug key"
          fi

      - name: Build apk
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.version.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: chordkey
        run: |
          gradle -p android assembleRelease --stacktrace
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Chord Key Changer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  release:
    needs: [version, windows, android]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release for the tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Chord Key Changer.exe
            dist/Chord Key Changer.apk
          generate_release_notes: true

      - name: Publish release for this commit to main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chord Key Changer ${{ needs.version.outputs.version }}
          body: |
            Automatic build of `main` at ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: |
            dist/Chord Key Changer.exe
            dist/Chord Key Changer.apk
          generate_release_notes: true
          make_latest: true
